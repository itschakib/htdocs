<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio DOM</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    table {
      background-color: white;
      margin: 20px auto;
      border-collapse: collapse;
    }

    td {
      width: 100px;
      height: 80px;
      text-align: center;
      font-size: 22px;
      border: 1px solid black;
    }

    .botones {
      margin-top: 30px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #2563eb;
      color: white;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>

  <h1>Ejercicio DOM</h1>

  <table id="tabla" width="300px" height="300px" border="1" align="center">
    <tr>
      <td>1</td>
      <td>2</td>
      <td>3</td>
    </tr>
    <tr>
      <td>4</td>
      <td>5</td>
      <td>6</td>
    </tr>
    <tr>
      <td>7</td>
      <td>8</td>
      <td>9</td>
    </tr>
  </table>

  <div class="botones">
    <button id="botonA">A - Cambiar tamaño</button>
    <button id="botonB">B - Cambiar borde</button>
    <button id="botonC">C - Cambiar alineación</button>
  </div>

  <script src="code.js"></script>
</body>

</html>
