<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio classList</title>

    <style>
        .panel {
            font-family: sans-serif;
            padding: 1rem;
            margin: 2rem auto;
            max-width: 400px;
        }

        button,
        input[type="checkbox"] {
            display: block;
            width: 100%;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .active {
            background-color: #e3f2fd;
            color: #1976d2;
            font-weight: bold;
        }

        .inactive {
            background-color: #f5f5f5;
            color: #555;
        }

        .disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }

        .highlighted {
            border: 2px solid #ff9800;
            padding-left: 12px;
        }
    </style>
</head>

<body>

    <div class="panel">
        <button id="btn-volumen">Volumen</button>
        <button id="btn-ecualizador">Ecualizador</button>
        <input type="checkbox" id="chk-mute" checked> Mudo
    </div>

</body>
  <script src="code.js" defer></script>
</html>
